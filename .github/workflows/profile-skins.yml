name: Profile skins

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:           # "Run workflow" button
  push:
    branches: [main]
    paths:
      - skins.config.json
      - skins-engine/**

permissions:
  contents: write

concurrency:
  group: profile-skins
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Render SVG cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Optional: personal token stored as secret SKINS_TOKEN. When present,
          # private repos and private contributions are counted automatically
          # (as numbers only, no private repo names appear on the cards).
          SKINS_TOKEN: ${{ secrets.SKINS_TOKEN }}
        run: node skins-engine/build.mjs

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skins
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore(skins): refresh profile cards [skip ci]"
          git push

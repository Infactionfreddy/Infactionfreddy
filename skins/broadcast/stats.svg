<svg xmlns="http://www.w3.org/2000/svg" width="445" height="215" viewBox="0 0 445 215" role="img" aria-label="Infactionfreddy GitHub stats">
<title>Infactionfreddy GitHub stats</title>
<style>

    .tally{animation:tally 2.4s ease-in-out infinite}
    @keyframes tally{0%,100%{opacity:1}50%{opacity:.35}}
    .scan{animation:scan 6s linear infinite}
    @keyframes scan{0%{transform:translateY(-40px)}100%{transform:translateY(420px)}}.ring{animation:ring 1.4s cubic-bezier(.2,.8,.2,1) both}@keyframes ring{from{stroke-dasharray:0 326.7}}
  .grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
  @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  .fade{animation:fade .8s ease-out both}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>

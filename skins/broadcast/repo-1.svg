<svg xmlns="http://www.w3.org/2000/svg" width="445" height="150" viewBox="0 0 445 150" role="img" aria-label="klipper-for-cnc repository">
<title>klipper-for-cnc repository</title>
<style>

    .tally{animation:tally 2.4s ease-in-out infinite}
    @keyframes tally{0%,100%{opacity:1}50%{opacity:.35}}
    .scan{animation:scan 6s linear infinite}
    @keyframes scan{0%{transform:translateY(-40px)}100%{transform:translateY(420px)}}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity=".025"/></pattern>
  <linearGradient id="vu" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#30d158"/><stop offset=".62" stop-color="#30d158"/><stop offset=".63" stop-color="#ffb000"/><stop offset=".84" stop-color="#ffb000"/><stop offset=".85" stop-color="#ff3b30"/></linearGradient>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff3b30"/><stop offset="1" stop-color="#ff7a45"/></linearGradient>
  <linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".02"/></linearGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="clip"><rect width="445" height="150" rx="10"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="445" height="150" fill="#0b0b0d"/>
  <rect width="445" height="150" fill="url(#grid)"/>
  <rect class="scan" x="0" y="0" width="445" height="40" fill="url(#scanG)"/>
  <rect x="0" y="0" width="445" height="3" fill="url(#acc)"/>
</g>

<rect x=".5" y=".5" width="444" height="149" rx="9.5" fill="none" stroke="#26262c"/>
<rect x="24" y="23" width="9" height="9" rx="1.5" fill="#ff3b30" class="tally" filter="url(#glow)"/>
<text x="40" y="32" font-family="'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" letter-spacing="1.4" fill="#8d8d96">VTR · REPOSITORY</text><path d="M3 2.5h8.5a1 1 0 0 1 1 1v9.5H4.5A1.5 1.5 0 0 1 3 11.5zM3 11.5A1.5 1.5 0 0 1 4.5 10h8" transform="translate(24 49) scale(1)" fill="none" stroke="#ff3b30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="63" font-family="'Inter','Segoe UI Variable','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#f4f4f5">klipper-for-cnc</text><text x="24" y="88" font-family="'Inter','Segoe UI Variable','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8d8d96">Klipper fork with CNC M-Code support (M0/M1/M2/M30) - ISO</text><text x="24" y="106" font-family="'Inter','Segoe UI Variable','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8d8d96">6983 compliant program control</text><circle cx="29" cy="128" r="5" fill="#555555"/><text x="40" y="132" font-family="'Inter','Segoe UI Variable','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#8d8d96">C</text><path d="M8 1.8l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.6l-3.8 2 .7-4.3-3.1-3 4.3-.6z" transform="translate(57.659 120) scale(0.875)" fill="none" stroke="#ffb000" stroke-width="1.5999999999999999" stroke-linecap="round" stroke-linejoin="round"/><text x="76.65899999999999" y="132" font-family="'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#f4f4f5">0</text><path d="M4.5 3a1.5 1.5 0 1 0 0 .01M11.5 3a1.5 1.5 0 1 0 0 .01M8 13a1.5 1.5 0 1 0 0 .01M4.5 4.5v1.2c0 1 .8 1.8 1.8 1.8h3.4c1 0 1.8-.8 1.8-1.8V4.5M8 7.5v4" transform="translate(94.979 120) scale(0.875)" fill="none" stroke="#8d8
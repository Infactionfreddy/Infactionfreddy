<style>

    .tally{animation:tally 2.4s ease-in-out infinite}
    @keyframes tally{0%,100%{opacity:1}50%{opacity:.35}}
    .scan{animation:scan 6s linear infinite}
    @keyframes scan{0%{transform:translateY(-40px)}100%{transform:translateY(420px)}}.sweep{animation:sweep 1.2s cubic-bezier(.2,.8,.2,1) both}@keyframes sweep{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}

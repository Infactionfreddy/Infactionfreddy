<svg xmlns="http://www.w3.org/2000/svg" width="445" height="249" viewBox="0 0 445 249" role="img" aria-label="Infactionfreddy GitHub stats">
<title>Infactionfreddy GitHub stats</title>
<style>

    .cur{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .flick{animation:flick 5s infinite}
    @keyframes flick{0%,96%,100%{opacity:1}97%{opacity:.82}98%{opacity:1}99%{opacity:.9}}.ring{animation:ring 1.4s cubic-bezier(.2,.8,.2,1) both}@keyframes ring{from{stroke-dasharray:0 326.7}}
  .grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
  @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  .fade{animation:fade .8s ease-out both}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".35"/></pattern>
  <radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>
  <radialGradient id="phos" cx=".3" cy=".2" r=".9"><stop offset="0" stop-color="#0d2414"/><stop offset="1" stop-color="#050b07"/></radialGradient>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#39ff88"/><stop offset="1" stop-color="#9dffc4"/></linearGradient>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="clip"><rect width="445" height="249" rx="12"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="445" height="249" fill="url(#phos)"/>
  <rect width="445" height="30" fill="#0c1a10"/>
  <rect y="30" width="445" height="1" fill="#1b3d26"/>
  <circle cx="18" cy="15" r="5" fill="#ff5f57" opacity=".85"/><circle cx="35" cy="15" r="5" fill="#febc2e" opacity=".85"/><circle cx="52" cy="15" r="5" fill="#28c840" opacity=".85"/>
  <text x="222.5" y="19" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#4e8a5c">~/stats</text>
</g>
<text x="24" y="68" font-family="'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#5f9a6a"><tspan fill="#39ff88">❯</tspan> gh stats --last 12mo</text><circle cx="92" cy="156" r="52" fill="none" stroke="#0f2a18" stroke-width="9"/><circle cx="92" cy="156" r="52" fill="none" stroke="#39ff88" stroke-width="9" stroke-linecap="butt" stroke-dasharray="12.5 326.7" transform="rotate(-90 92 156)" class="ring" filter="url(#glow)"/><text x="92" y="160" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,'Liberation Mono',monospace" font-size="28" font-weight="750" fill="#d6ffdc">34</text><text x="92" y="178" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" fill="#5f9a6a">contrib / yr</text><text x="92" y="234" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#5f9a6a">active <tspan fill="#b9f6c0" font-weight="700">14</tspan>/365 d</text><text x="188" y="106" font-family="'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#9dffc4">commits_12_mo<tspan fill="#2f5a39"> ............... </tspan><tspan fill="#b9f6c0" font-weight="700">20</tspan></text><text x="188" y="133" font-family="'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#9dffc4">pull_requests<tspan fill="#2f5a39"> ............... </tspan><tspan fill="#b9f6c0" font-weight="700">11</tspan></text><text x="188" y="160" font-family="'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#9dffc4">issues<tspan fill="#2f5a39"> ...................... </tspan><tspan fill="#b9f6c0" font-weight="700">12</tspan></text><text x="188" y="187" font-family="'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#9dffc4">repositories<tspan fill="#2f5a39"> ................ </tspan><tspan fill="#b9f6c0" font-weight="700">37</tspan></text><text x="188" y="214" font-family="'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#9dffc4">followers<tspan fill="#2f5a39"> .................... </tspan><tspan fill="#b9f6c0" font-weight="700">1</tspan></text>
<g clip-path="url(#clip)" pointer-events="none">
  <rect y="30" width="445" height="219" fill="url(#scan)" opacity=".45"/>
  <rect width="445" height="249" fill="url(#vig)"/>
</g>
<rect x=".5" y=".5" width="444" height="248" rx="11.5" fill="none" stroke="#163a22"/>
</svg>

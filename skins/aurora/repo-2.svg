le(0.875)" fill="none" stroke="#9097c2" stroke-width="1.5999999999999999" stroke-linecap="round" stroke-linejoin="round"/><text x="147.279" y="132" font-family="'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#eef0ff">0</text><text x="421" y="132" text-anchor="end" font-family="'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#5b6190">upd 2025-12-14</text>


<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="Freddy — GitHub profile banner">
<title>Freddy — GitHub profile banner</title>
<style>

    .blob{animation:drift 18s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
    .b2{animation-duration:23s;animation-delay:-6s}.b3{animation-duration:29s;animation-delay:-11s}
    @keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-14px) scale(1.12)}100%{transform:translate(-24px,10px) scale(.94)}}
    .shine{animation:shine 7s ease-in-out infinite}
    @keyframes shine{0%,100%{opacity:.35}50%{opacity:.9}}
  .grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
  @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  .fade{animation:fade .8s ease-out both}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0e1c"/><stop offset="1" stop-color="#090a12"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".45" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#a78bfa" stop-opacity=".25"/></linearGradient>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset=".55" stop-color="#22d3ee"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
  <linearGradient id="accV" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="clip"><rect width="900" height="250" rx="18"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="900" height="250" fill="url(#bg)"/>
  <g filter="url(#blur)" opacity=".55">
    <ellipse class="blob" cx="774" cy="20" rx="198" ry="112.5" fill="#7c3aed"/>
    <ellipse class="blob b2" cx="558" cy="250" rx="180" ry="87.5" fill="#0891b2"/>
    <ellipse class="blob b3" cx="72" cy="237.5" rx="144" ry="75" fill="#db2777" opacity=".6"/>
  </g>
  <rect x="18" y="0" width="864" height="1" fill="url(#acc)" class="shine"/>
</g>
<rect x=".5" y=".5" width="899" height="249" rx="17.5" fill="none" stroke="url(#edge)"/>
<text x="44" y="46" font-family="'Inter','Segoe UI Variable','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="0.6" fill="#9097c2">@Infactionfreddy  ·  Berlin</text><defs><linearGradient id="nameG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#e3dcff"/><stop offset="1" stop-color="#9ee9f5"/></linearGradient></defs><text x="42" y="100" font-family="'Inter','Segoe UI Variable','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="56" font-weight="750" letter-spacing="-0.8" fill="url(#nameG)">Freddy</text><text x="44" y="132" font-family="'Inter','Segoe UI Variable','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#9097c2">Electrical engineering student from Berlin · embedded systems</text><text x="44" y="155" font-family="'Inter','Segoe UI Variable','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#9097c2">CNC &amp; 3D printing · broadcast and live-event tech.</text><g class="fade"><rect x="44" y="187" width="29.015" height="26" rx="13" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/><text x="58.5075" y="204" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="500" fill="#eef0ff" opacity="0.92">C</text></g><g class="fade"><rect x="81.015" y="187" width="43.045" height="26" rx="13" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/><text x="102.5375" y="204" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="500" fill="#eef0ff" opacity="0.92">C++</text></g><g class="fade"><rect x="132.06" y="187" width="64.09" height="26" rx="13" fill="rgba(255,
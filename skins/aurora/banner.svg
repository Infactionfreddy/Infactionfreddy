erse}.o3{animation-duration:7s}@keyframes orbit{to{transform:rotate(360deg)}}</style><circle cx="753" cy="125" r="92" fill="none" stroke="url(#acc)" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="2 6"/><circle cx="753" cy="125" r="70" fill="none" stroke="url(#acc)" stroke-opacity="0.3" stroke-width="1"/><circle cx="753" cy="125" r="48" fill="none" stroke="url(#acc)" stroke-opacity="0.42" stroke-width="1"/><g class="orb"><circle cx="845" cy="125" r="4.5" fill="#22d3ee" filter="url(#glow)"/></g><g class="orb o2"><circle cx="753" cy="55" r="3.5" fill="#f472b6" filter="url(#glow)"/></g><g class="orb o3"><circle cx="705" cy="125" r="3" fill="#a78bfa" filter="url(#glow)"/></g><circle cx="753" cy="125" r="28" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)"/><text x="753" y="134" text-anchor="middle" font-family="'Inter','Segoe UI Variable','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="26" font-weight="750" fill="url(#acc)">F</text>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="445" height="215" viewBox="0 0 445 215" role="img" aria-label="Infactionfreddy GitHub stats">
<title>Infactionfreddy GitHub stats</title>
<style>

    .blob{animation:drift 18s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
    .b2{animation-duration:23s;animation-delay:-6s}.b3{animation-duration:29s;animation-delay:-11s}
    @keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-14px) scale(1.12)}100%{transform:translate(-24px,10px) scale(.94)}}
    .shine{animation:shine 7s ease-in-out infinite}
    @keyframes shine{0%,100%{opacity:.35}50%{opacity:.9}}.ring{animation:ring 1.4s cubic-bezier(.2,.8,.2,1) both}@keyframes ring{from{stroke-dasharray:0 326.7}}
  .grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
  @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  .fade{animation:fade .8s ease-out both}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0e1c"/><stop offset="1" stop-color="#090a12"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".45" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#a78bfa" stop-opacity=".25"/></linearGradient>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset=".55" stop-color="#22d3ee"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
  <linearGradient id="accV" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="47.3"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="clip"><rect width="445" height="215" rx="18"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="445" height="215" fill="url(#bg)"/>
  <g filter="url(#blur)" opacity=".55">
    <ellipse class="blob" cx="382.7" cy="17.2" rx="97.9" ry="96.75" fill="#7c3aed"/>
    <ellipse class="blob b2" cx="275.9" cy="215" rx="89" ry="75.25" fill="#0891b2"/>
    <ellipse class="blob b3" cx="35.6" cy="204.25" rx="71.2" ry="64.5" fill="#db2777" opacity=".6"/>
  </g>
  <rect x="18" y="0" width="409" height="1" fill="url(#acc)" class="shine"/>
</g>
<rect x=".5" y=".5" width="444" height="214" rx="17.5" fill="none" stroke="url(#edge)"/>
<circle cx="27" cy="30" r="3" fill="url(#acc)"/>
<text x="37" y="34" font-family="'Inter','Segoe UI Variable','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="650" letter-spacing="1.6" fill="#9097c2">GITHUB STATS</text><circle cx="92" cy="122" r="52" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="9"/><circle cx="92" cy="122" r="52" fill="none" stroke="url(#acc)" stroke-width="9" stroke-linecap="round" stroke-dasharray="7.2 326.7" transform="rotate(-90 92 122)" class="ring" filter="url(#glow)"/><text x="92" y="126" text-anchor="middle" font-family="'Inter','Segoe UI Variable','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="28" font-weight="750" fill="#ffffff">20</text><text x="92" y="144" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" fill="#9097c2">contrib / yr</text><text x="92" y="200" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#9097c2">active <tspan fill="#eef0ff" font-weight="700">8</tspan>/365 d</text><path d="M8 5.2a2.8 2.8 0 1 1 0 5.6 2.8 2.8 0 0 1 0-5.6zM1 8h4.2M10.8 8H15" transform="translate(188 60) scale(0.9375)" fill="none" stroke="#f472b6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="212" y="72" font-family="'Inter','Segoe UI Variable','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#9097c2">Commits · 12 mo</text><text x="421" y="72" text-anchor="end" font-family="'Inter','Segoe UI Variable','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#eef0ff">11</text><path d="M4 3.5v9M4 3.5a1.6 1.6 0 1 0 0-.01M4 12.5a1.6 1.6 0 1 0 0 .01M12 12.5a1.6 1.6 0 1 0 0 .01M12 11V6.5c0-1.4-1-2.5-2.5-2.5H7.5M9 2.5L7.5 4 9 5.5" transform=